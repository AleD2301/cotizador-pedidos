<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Cyberpunk - Tasa BCV Automática</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050814;
            /* Fondo geométrico de colmenas con efecto neón futurista */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                radial-gradient(
                    circle, 
                    rgba(0, 210, 255, 0.08) 1px, 
                    transparent 1px
                );
            background-size: 100% 100%, 100% 100%, 30px 30px;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .card {
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.15), inset 0 0 15px rgba(138, 43, 226, 0.1);
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 2;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #00d2ff;
            font-size: 26px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            font-weight: 800;
        }

        .tasa-badge {
            text-align: center;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #00f0ff;
            margin-bottom: 22px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1);
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #a5b4fc;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(5, 8, 20, 0.8);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            box-sizing: border-box;
            font-size: 18px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4), inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .results {
            background: rgba(138, 43, 226, 0.05);
            border: 1px solid rgba(138, 43, 226, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: inset 0 0 10px rgba(138, 43, 226, 0.05);
        }

        .result-item {
            margin-bottom: 16px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .result-item:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .result-title {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .result-values {
            font-size: 19px;
            font-weight: bold;
            color: #f8fafc;
            margin-top: 5px;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .bs-text {
            color: #34d399;
            font-size: 16px;
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.3);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #00f0ff, #7928ca);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            opacity: 1;
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(121, 40, 202, 0.7), 0 0 15px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ CYBER-COTIZADOR</h2>
        <div id="tasaInfo" class="tasa-badge">Sincronizando tasa BCV oficial...</div>
        
        <div class="input-group">
            <label for="precioTotal">Precio Total del Producto ($):</label>
            <input type="number" id="precioTotal" placeholder="Ej. 50" step="0.01" oninput="calcularTodo()">
        </div>

        <div class="results">
            <div class="result-item">
                <div class="result-title">Precio Total</div>
                <div class="result-values">$<span id="resTotalUSD">0.00</span> <span class="bs-text">(Bs. <span id="resTotalBS">0.00</span>)</span></div>
            </div>
            <div class="result-item">
                <div class="result-title">Anticipo (70%)</div>
                <div class="result-values">$<span id="resAnticipoUSD">0.00</span> <span class="bs-text">(Bs. <span id="resAnticipoBS">0.00</span>)</span></div>
            </div>
            <div class="result-item">
                <div class="result-title">Saldo Restante (30%)</div>
                <div class="result-values">$<span id="resSaldoUSD">0.00</span> <span class="bs-text">(Bs. <span id="resSaldoBS">0.00</span>)</span></div>
            </div>
        </div>

        <button onclick="copiarMensajePro()">Copiar Mensaje Completo para WhatsApp</button>
    </div>

    <script>
        let tasaGlobal = 0;

        async function obtenerTasaBCV() {
            try {
                let respuesta = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                let datos = await respuesta.json();
                tasaGlobal = datos.promedio;
                
                document.getElementById('tasaInfo').innerText = `⚡ Tasa Oficial BCV: Bs. ${tasaGlobal.toFixed(2)}`;
                calcularTodo();
            } catch (error) {
                console.error("Error al obtener la tasa:", error);
                document.getElementById('tasaInfo').innerText = "⚠️ Error de conexión con el BCV automático";
            }
        }

        function calcularTodo() {
            let precio = parseFloat(document.getElementById('precioTotal').value) || 0;

            let anticipoUSD = precio * 0.70;
            let saldoUSD = precio * 0.30;

            document.getElementById('resTotalUSD').innerText = precio.toFixed(2);
            document.getElementById('resAnticipoUSD').innerText = anticipoUSD.toFixed(2);
            document.getElementById('resSaldoUSD').innerText = saldoUSD.toFixed(2);

            let totalBS = precio * tasaGlobal;
            let anticipoBS = anticipoUSD * tasaGlobal;
            let saldoBS = saldoUSD * tasaGlobal;

            document.getElementById('resTotalBS').innerText = totalBS.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('resAnticipoBS').innerText = anticipoBS.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('resSaldoBS').innerText = saldoBS.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function copiarMensajePro() {
            let precio = document.getElementById('precioTotal').value;
            
            if (!precio || precio <= 0 || tasaGlobal <= 0) {
                alert("Por favor espera a que cargue la tasa y escribe un precio válido.");
                return;
            }

            let totalUSD = document.getElementById('resTotalUSD').innerText;
            let totalBS = document.getElementById('resTotalBS').innerText;
            let antUSD = document.getElementById('resAnticipoUSD').innerText;
            let antBS = document.getElementById('resAnticipoBS').innerText;
            let salUSD = document.getElementById('resSaldoUSD').innerText;
            let salBS = document.getElementById('resSaldoBS').innerText;

            let texto = `*Cotización de Pedido* 🛍️\n\n` +
                        `• *Precio Total:* $${totalUSD} (Bs. ${totalBS})\n` +
                        `• *Adelanto (70%):* $${antUSD} (Bs. ${antBS})\n` +
                        `• *Restante (30%):* $${salUSD} (Bs. ${salBS})\n\n` +
                        `*(Tasa oficial BCV: Bs. ${tasaGlobal.toFixed(2)})*\n` +
                        `¿Te gustaría confirmar el encargo?`;

            navigator.clipboard.writeText(texto).then(() => {
                alert("¡Cotización copiada al portapapeles con éxito!");
            });
        }

        window.onload = obtenerTasaBCV;
    </script>

</body>
</html>
