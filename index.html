<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechImports USA | Mini UPS Inteligente</title>
    <style>
        /* --- Variables de Color Futurista --- */
        :root {
            --bg-dark: #050915;
            --bg-card: rgba(10, 16, 35, 0.7);
            --neon-cyan: #00f2ff;
            --neon-purple: #a200ff;
            --neon-green: #00ff88;
            --text-main: #e0e7ff;
            --text-sub: #94a3b8;
        }

        /* --- Reset y Estilos Globales --- */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(162, 0, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(0, 242, 255, 0.1) 0%, transparent 40%),
                linear-gradient(to right, rgba(10, 16, 35, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(10, 16, 35, 0.2) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Header (Estilo Barra de Navegación Tech) --- */
        header {
            width: 100%;
            max-width: 1200px;
            background: rgba(10, 16, 35, 0.9);
            backdrop-filter: blur(15px);
            padding: 15px 30px;
            border-bottom: 2px solid var(--neon-purple);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .tasa-header {
            font-size: 14px;
            color: var(--neon-green);
            background: rgba(0, 255, 136, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--neon-green);
        }

        /* --- Contenedor Principal de la Ficha de Producto --- */
        .product-main {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 Columnas: Imagen y Detalles */
            gap: 40px;
            margin-bottom: 40px;
            box-sizing: border-box;
        }

        /* --- Columna Izquierda: Galería --- */
        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-image-container {
            background: var(--bg-card);
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.15);
            aspect-ratio: 1 / 1; /* Mantiene la imagen cuadrada */
        }

        .main-image-container::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 242, 255, 0.03), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
            cursor: zoom-in;
        }

        .product-img:hover {
            transform: scale(1.05);
        }

        .thumbnail-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .thumbnail {
            width: 80px; height: 80px;
            background: var(--bg-card);
            border: 1px solid var(--neon-purple);
            border-radius: 10px;
            padding: 5px;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s ease;
        }

        .thumbnail:hover, .thumbnail.active {
            opacity: 1;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        /* --- Columna Derecha: Detalles y Compra (Estilo Amazon Evolution) --- */
        .product-details {
            background: var(--bg-card);
            border: 2px solid var(--neon-purple);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            box-shadow: 0 0 40px rgba(162, 0, 255, 0.1);
        }

        .product-category {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-bottom: -10px;
        }

        .product-title {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            line-height: 1.2;
        }

        .rating {
            color: var(--neon-green);
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .price-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            padding-bottom: 20px;
        }

        .price-label {
            font-size: 14px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-price-usd {
            font-size: 48px;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 15px var(--neon-green);
        }

        .product-price-bs {
            font-size: 18px;
            color: var(--text-sub);
            margin-top: -5px;
        }

        /* --- Sección de Acción: Anticipo e Info de Compra --- */
        .action-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .anticipo-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            color: #fff;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(0, 242, 255, 0.05);
            border-left: 4px solid var(--neon-cyan);
        }

        .anticipo-val {
            font-weight: bold;
            color: var(--neon-cyan);
            font-size: 20px;
        }

        .stock-status {
            color: var(--neon-green);
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stock-dot {
            height: 12px; width: 12px;
            background-color: var(--neon-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse 2s infinite;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #050915;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 242, 255, 0.5);
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--neon-purple);
            border: 2px solid var(--neon-purple);
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(162, 0, 255, 0.1);
            color: #fff;
            border-color: #fff;
        }

        .import-info {
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .import-info strong { color: var(--neon-green); }

        /* --- Sección de Características (Debajo de la Ficha Principal) --- */
        .features-section {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 40px;
            box-sizing: border-box;
        }

        .feature-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.1);
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 30px;
            color: var(--neon-cyan);
        }

        .feature-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .feature-desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        /* --- Responsiveness (Adaptación a Móviles) --- */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
            }
            
            .product-main {
                grid-template-columns: 1fr; /* Pasa a una sola columna */
                gap: 25px;
            }
            
            .product-gallery, .product-details {
                padding: 20px;
            }
            
            .product-title {
                font-size: 24px;
            }

            .product-price-usd {
                font-size: 36px;
            }

            .features-section {
                grid-template-columns: 1fr; /* Pasa a una sola columna */
            }
        }

        /* --- Animaciones --- */
        @keyframes shine {
            0% { left: -50%; }
            100% { left: 120%; }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0);
